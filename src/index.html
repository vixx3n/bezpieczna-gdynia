<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bezpieczna Gdynia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Dane publiczne • Gdynia</p>
      <h1>Bezpieczna Gdynia</h1>
      <p>Kwartalne statystyki wypadków drogowych z ofiarami w Gdyni.</p>
    </header>

    <section aria-labelledby="stats-title">
      <h2 id="stats-title">Statystyki</h2>
      <label for="year-filter">Wybierz rok</label>
<select id="year-filter" disabled>
  <option value="all">Wszystkie lata</option>
</select>
      <p id="data-status" role="status">Wczytywanie danych…</p>
      <div class="cards">
        <article class="card">
          <h3>Wypadki</h3>
          <p id="accidents">…</p>
        </article>
        <article class="card">
          <h3>Ranni</h3>
          <p id="injured">…</p>
        </article>
        <article class="card">
          <h3>Zabici</h3>
          <p id="deaths">…</p>
        </article>
      </div>
    </section>
  </main>
  <script src="app.js?v=2"></script>
</body>
</html>
