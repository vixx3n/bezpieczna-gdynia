name: Testy i lint

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod projektu
        uses: actions/checkout@v7

      - name: Ustaw Pythona
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Zainstaluj Ruffa
        run: python -m pip install ruff==0.17.5

      - name: Sprawdz kod Pythona
        run: python -m ruff check scripts tests

      - name: Uruchom testy
        run: python -m unittest discover -s tests -v